services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://subsentry:subsentry@db:5432/subsentry
      PAYPAL_MODE: mock
      SECRET_KEY: change-me-in-production
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run preview -- --host 0.0.0.0 --port 4173
    ports:
      - "4173:4173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: subsentry
      POSTGRES_PASSWORD: subsentry
      POSTGRES_DB: subsentry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
